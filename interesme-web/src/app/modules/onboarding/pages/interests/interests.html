<main class="onboarding-page">
  <section class="onboarding-card">
    <div class="onboarding-copy">
      <p class="eyebrow">{{ text().eyebrow }}</p>
      <h1>{{ text().title }}</h1>
      <p>{{ text().description }}</p>
    </div>

    <p class="helper-text">{{ text().helper }}</p>

    <div class="interest-list" [attr.aria-label]="text().aria">
      @for (interest of interests(); track interest.value) {
        <button
          class="interest-chip"
          type="button"
          [ngClass]="{ 'is-selected': isSelected(interest.value) }"
          [attr.aria-pressed]="isSelected(interest.value)"
          (click)="toggleInterest(interest.value)"
        >
          {{ interest.label }}
        </button>
      }
    </div>

    <button class="continue-button" type="button" [disabled]="selectedInterests().length === 0" (click)="continue()">
      {{ text().continue }}
    </button>
  </section>
</main>
