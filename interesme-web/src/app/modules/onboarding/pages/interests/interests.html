<main class="onboarding-page">
  <section class="onboarding-card">
    <div class="onboarding-copy">
      <p class="eyebrow">{{ text().eyebrow }}</p>
      <h1>{{ text().title }}</h1>
      <p>{{ text().description }}</p>
    </div>

    <p class="helper-text">{{ text().helper }}</p>

    @if (isLoading()) {
      <p class="helper-text" role="status">{{ text().loading }}</p>
    } @else if (loadFailed()) {
      <p class="helper-text is-error" role="alert">{{ errorMessage() }}</p>
      <button class="continue-button" type="button" (click)="loadInterests()">{{ text().retry }}</button>
    } @else {
      <div class="interest-list" [attr.aria-label]="text().aria">
        @for (interest of interests(); track interest.id) {
          <button
            class="interest-chip"
            type="button"
            [ngClass]="{ 'is-selected': isSelected(interest.id) }"
            [attr.aria-pressed]="isSelected(interest.id)"
            [disabled]="isSaving()"
            (click)="toggleInterest(interest.id)"
          >
            {{ interest.name }}
          </button>
        }
      </div>

      @if (errorMessage()) {
        <p class="helper-text is-error" role="alert">{{ errorMessage() }}</p>
      }

      <button
        class="continue-button"
        type="button"
        [disabled]="selectedInterestIds().length === 0 || isSaving()"
        (click)="continue()"
      >
        {{ isSaving() ? text().saving : text().continue }}
      </button>
    }
  </section>
</main>
