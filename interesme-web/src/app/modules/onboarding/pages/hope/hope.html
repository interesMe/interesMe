<main class="onboarding-page">
  <section class="onboarding-card">
    <div class="hope-accent" aria-hidden="true"></div>

    <div class="onboarding-copy">
      <p class="eyebrow">{{ text().eyebrow }}</p>
      <h1>{{ text().title }}</h1>
      <p>{{ text().description }}</p>
      <p>{{ text().start }}</p>
    </div>

    <button class="enter-button" type="button" (click)="enterInteresMe()">{{ text().enter }}</button>
  </section>
</main>
