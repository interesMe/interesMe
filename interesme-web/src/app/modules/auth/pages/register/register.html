<section class="auth-card">
  <header class="auth-header">
    <p class="eyebrow">InteresMe</p>
    <h1>{{ t('auth.register.title') }}</h1>
    <p>{{ t('auth.register.subtitle') }}</p>
  </header>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>{{ t('auth.register.displayName') }}</span>
      <input type="text" autocomplete="name" formControlName="displayName" [placeholder]="t('auth.register.displayNamePlaceholder')" />
      @if (showRequiredError('displayName')) {
        <span class="hint">{{ t('auth.validation.displayName') }}</span>
      }
    </label>

    <label class="field">
      <span>{{ t('auth.common.email') }}</span>
      <input type="email" autocomplete="email" formControlName="email" [placeholder]="t('auth.common.emailPlaceholder')" />
      @if (showRequiredError('email')) {
        <span class="hint">{{ t('auth.validation.email') }}</span>
      }
    </label>

    <label class="field">
      <span>{{ t('auth.common.password') }}</span>
      <input
        type="password"
        autocomplete="new-password"
        formControlName="password"
        [placeholder]="t('auth.register.passwordPlaceholder')"
      />
      @if (showRequiredError('password')) {
        <span class="hint">{{ t('auth.validation.passwordLength') }}</span>
      }
    </label>

    <label class="field">
      <span>{{ t('auth.register.confirmPassword') }}</span>
      <input
        type="password"
        autocomplete="new-password"
        formControlName="confirmPassword"
        [placeholder]="t('auth.register.confirmPasswordPlaceholder')"
      />
      @if (showRequiredError('confirmPassword')) {
        <span class="hint">{{ t('auth.validation.confirmPassword') }}</span>
      }
    </label>

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    <button class="auth-submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? t('auth.common.loading') : t('auth.register.submit') }}
    </button>
  </form>

  @if (hasReturnUrl()) {
    <a class="return-link" [routerLink]="returnUrl()">{{ t('auth.register.backToIntent') }}</a>
  }

  <p class="auth-switch">
    {{ t('auth.register.switchPrompt') }}
    <a [routerLink]="loginPath()" [queryParams]="loginQueryParams()">{{ t('auth.register.switchAction') }}</a>
  </p>
</section>
