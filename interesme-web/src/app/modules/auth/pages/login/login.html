<section class="auth-card">
  <header class="auth-header">
    <p class="eyebrow">InteresMe</p>
    <h1>{{ t('auth.login.title') }}</h1>
    <p>{{ t('auth.login.subtitle') }}</p>
  </header>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>{{ t('auth.common.email') }}</span>
      <input type="email" autocomplete="email" formControlName="email" [placeholder]="t('auth.common.emailPlaceholder')" />
      @if (showRequiredError('email')) {
        <span class="hint">{{ t('auth.validation.email') }}</span>
      }
    </label>

    <label class="field">
      <span>{{ t('auth.common.password') }}</span>
      <input
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [placeholder]="t('auth.login.passwordPlaceholder')"
      />
      @if (showRequiredError('password')) {
        <span class="hint">{{ t('auth.validation.passwordRequired') }}</span>
      }
    </label>

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    <button class="auth-submit" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? t('auth.common.loading') : t('auth.login.submit') }}
    </button>

    <div class="auth-divider"><span>{{ t('auth.common.or') }}</span></div>

    <app-google-button
      [clientId]="googleClientId"
      [disabled]="isSubmitting()"
      (idToken)="continueWithGoogle($event)"
      (error)="showGoogleError($event)"
      (loadingChange)="setGoogleLoading($event)"
    />

    <app-github-button
      [authUrl]="githubLoginUrl"
      [returnUrl]="returnUrl()"
      [disabled]="isSubmitting()"
      (error)="showGithubError($event)"
      (loadingChange)="setGithubLoading($event)"
    />
  </form>

  @if (hasReturnUrl()) {
    <a class="return-link" [routerLink]="returnUrl()">{{ t('auth.login.backToIntent') }}</a>
  }

  <p class="auth-switch">
    {{ t('auth.login.switchPrompt') }}
    <a [routerLink]="registerPath()" [queryParams]="registerQueryParams()">{{ t('auth.login.switchAction') }}</a>
  </p>
</section>
