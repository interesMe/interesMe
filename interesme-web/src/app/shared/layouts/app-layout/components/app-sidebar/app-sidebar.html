<aside class="app-sidebar" aria-label="Product navigation">
  <a class="brand" [routerLink]="['/', 'home']" aria-label="InteresMe home">
    <span class="brand-mark" aria-hidden="true">
      <span></span>
      <span></span>
    </span>
    <span class="brand-text">InteresMe</span>
  </a>

  <nav class="sidebar-nav" aria-label="Protected pages">
    @for (item of navItems; track item.label) {
      @if (isRouteItem(item)) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? true }"
        >
          <span class="nav-icon" aria-hidden="true">
            <img [src]="item.icon" alt="" />
          </span>
          <span>{{ item.label }}</span>
        </a>
      } @else {
        <span class="nav-item is-disabled" aria-disabled="true">
          <span class="nav-icon" aria-hidden="true">
            <img [src]="item.icon" alt="" />
          </span>
          <span>{{ item.label }}</span>
        </span>
      }
    }
  </nav>

  <section class="sidebar-promo" aria-label="Create initiative promotion">
    <div class="promo-art" aria-hidden="true">
      <span class="promo-orbit one"></span>
      <span class="promo-orbit two"></span>
      <span class="promo-core">✦</span>
    </div>

    <h3>Create something amazing today</h3>
    <p>Start an initiative and find people who share your passion.</p>

    <button type="button">
      <span aria-hidden="true">+</span>
      Create Initiative
    </button>
  </section>

  <section class="user-card" aria-label="Current user">
    <div class="user-avatar" aria-hidden="true">M</div>

    <div class="user-info">
      <strong>Max</strong>
      <span>@max</span>
    </div>

    <span class="user-more" aria-hidden="true">⌄</span>
  </section>

  <div class="sidebar-footer">
    <button class="logout-button" type="button" (click)="logout()">
      <span class="nav-icon" aria-hidden="true">
        <img src="/assets/icons/settings.svg" alt="" />
      </span>
      <span>Log out</span>
    </button>
  </div>
</aside>
