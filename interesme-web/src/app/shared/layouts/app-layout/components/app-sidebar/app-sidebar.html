<aside class="app-sidebar" [attr.aria-label]="text().productNavigationAria">
  <a class="brand" [routerLink]="['/', 'home']" [attr.aria-label]="text().homeAria">
    <span class="brand-mark" aria-hidden="true">
      <span></span>
      <span></span>
    </span>
    <span class="brand-text">InteresMe</span>
  </a>

  <nav class="sidebar-nav" [attr.aria-label]="text().protectedPagesAria">
    @for (item of navItems; track item.labelKey) {
      @if (isRouteItem(item)) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? true }"
        >
          <span class="nav-icon" aria-hidden="true">
            <img [src]="item.icon" alt="" />
          </span>
          <span>{{ label(item) }}</span>
        </a>
      } @else {
        <span class="nav-item is-disabled" aria-disabled="true">
          <span class="nav-icon" aria-hidden="true">
            <img [src]="item.icon" alt="" />
          </span>
          <span>{{ label(item) }}</span>
        </span>
      }
    }
  </nav>

  <section class="sidebar-promo" [attr.aria-label]="text().promoAria">
    <div class="promo-art" aria-hidden="true">
      <span class="promo-orbit one"></span>
      <span class="promo-orbit two"></span>
      <span class="promo-core">✦</span>
    </div>

    <h3>{{ text().promoTitle }}</h3>
    <p>{{ text().promoDescription }}</p>

    <button type="button">
      <span aria-hidden="true">+</span>
      {{ text().createInitiative }}
    </button>
  </section>

  <section class="user-card" [attr.aria-label]="text().currentUserAria">
    <div class="user-avatar" aria-hidden="true">M</div>

    <div class="user-info">
      <strong>Max</strong>
      <span>@max</span>
    </div>

    <span class="user-more" aria-hidden="true">⌄</span>
  </section>

  <div class="sidebar-footer">
    <button class="logout-button" type="button" (click)="logout()">
      <span class="nav-icon" aria-hidden="true">
        <img src="/assets/icons/settings.svg" alt="" />
      </span>
      <span>{{ text().logout }}</span>
    </button>
  </div>
</aside>
