services:

  postgres:
    image: postgres:16-alpine
    container_name: interesme-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./InteresMe.API

    container_name: interesme-api

    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FRONTEND_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      FRONTEND_OAUTH_CALLBACK_URL: ${FRONTEND_OAUTH_CALLBACK_URL:-http://localhost:4201/auth/callback}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./interesme-web

    container_name: interesme-client

    environment:
      API_BASE_URL: http://localhost:8080/api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    ports:
      - "${FRONTEND_PORT:-4201}:4200"

    depends_on:
      - backend

volumes:
  postgres_data:
