services:

  postgres:
    image: postgres:16-alpine
    container_name: interesme-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./InteresMe.API

    container_name: interesme-api

    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FRONTEND_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      FRONTEND_OAUTH_CALLBACK_URL: ${FRONTEND_OAUTH_CALLBACK_URL:-http://localhost:4200/auth/callback}
      Auth__Frontend__OAuthCallbackUrl: ${FRONTEND_OAUTH_CALLBACK_URL:-http://localhost:4200/auth/callback}

    ports:
      - "8080:8080"

    volumes:
      - post_uploads:/app/wwwroot/uploads

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./interesme-web
      target: development

    container_name: interesme-client

    environment:
      API_BASE_URL: http://localhost:8080/api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    command:
      [
        "sh",
        "-c",
        "printf 'window.__INTERESME_CONFIG__ = { apiBaseUrl: \"%s\", googleClientId: \"%s\" };\\n' \"${API_BASE_URL:-http://localhost:8080/api}\" \"${GOOGLE_CLIENT_ID:-}\" > /app/public/env.js && npm start -- --host 0.0.0.0 --port 4200",
      ]

    volumes:
      - ./interesme-web/src:/app/src
      - ./interesme-web/angular.json:/app/angular.json:ro
      - ./interesme-web/package.json:/app/package.json:ro
      - ./interesme-web/package-lock.json:/app/package-lock.json:ro
      - ./interesme-web/tsconfig.json:/app/tsconfig.json:ro
      - ./interesme-web/tsconfig.app.json:/app/tsconfig.app.json:ro
      - frontend_node_modules:/app/node_modules

    ports:
      - "${FRONTEND_PORT:-4200}:4200"

    depends_on:
      - backend

  frontend-prod:
    profiles:
      - production
    build:
      context: ./interesme-web
      target: production

    container_name: interesme-client-prod

    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    ports:
      - "${FRONTEND_PROD_PORT:-8081}:80"

    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  post_uploads:
