name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    # Ephemeral credentials for CI only — not used in production (.env)
    env:
      POSTGRES_USER: interesme
      POSTGRES_PASSWORD: Wp8kN2mQ9xR4vL7tY1zA6bC0dE3fG5hJ8kM1nP4qS7u
      POSTGRES_DB: interesme
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      AUTH_TOKEN_SECRET: CiOnly7kM9nP2qS5uV8wX1yZ4aB6cD0eF3gH5jK8mN1pQ4rT7vW0xY3zA6bC9dE2fG

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interesme
          POSTGRES_PASSWORD: Wp8kN2mQ9xR4vL7tY1zA6bC0dE3fG5hJ8kM1nP4qS7u
          POSTGRES_DB: interesme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interesme -d interesme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore
        working-directory: ./InteresMe.API

      - name: Build backend
        run: dotnet build --no-restore
        working-directory: ./InteresMe.API

  frontend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./InteresMe.Client

      - name: Build frontend
        run: npm run build
        working-directory: ./InteresMe.Client
