<div
  class="landing"
  [ngClass]="{
    'relationship-active': activeSide() === 'relationship',
    'work-active': activeSide() === 'work'
  }"
>

  <div class="logo">
    InteresMe
  </div>

  <div class="divider"></div>

  <!-- RELATIONSHIP -->

  <section
    class="side relationship"
    (mouseenter)="setSide('relationship')"
    (mouseleave)="setSide(null)"
  >

    <video
      class="bg-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablePictureInPicture
      controlsList="nodownload nofullscreen noremoteplayback"
    >
      <source
        src="/videos/relationship.mp4"
        type="video/mp4"
      />
    </video>

    <div class="overlay relationship-overlay"></div>

    <div class="content">

      <span class="label">
        PERSONAL
      </span>

      <h1>
        Relationships
      </h1>

      <p>
        Meet people through conversations first.
        Appearance comes later.
      </p>

      <button>
        Continue
      </button>

    </div>

  </section>

  <!-- WORK -->

  <section
    class="side work"
    (mouseenter)="setSide('work')"
    (mouseleave)="setSide(null)"
  >

    <video
      class="bg-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablePictureInPicture
      controlsList="nodownload nofullscreen noremoteplayback"
    >
      <source
        src="/videos/work.mp4"
        type="video/mp4"
      />
    </video>

    <div class="overlay work-overlay"></div>

    <div class="content">

      <span class="label work-label">
        PROFESSIONAL
      </span>

      <h1>
        Work
      </h1>

      <p>
        Build meaningful professional
        connections without superficiality.
      </p>

      <button>
        Continue
      </button>

    </div>

  </section>

</div>
